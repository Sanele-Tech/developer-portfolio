# Database Connection
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Flyway manages the database schema.
spring.flyway.enabled=true

# Uploaded media is stored as original bytes in PostgreSQL.
portfolio.media.public-base-url=${PORTFOLIO_MEDIA_PUBLIC_BASE_URL:http://localhost:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# SMTP settings are supplied at runtime; outbound email failures are recorded without rejecting messages.
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
portfolio.mail.from=${PORTFOLIO_MAIL_FROM:${SPRING_MAIL_USERNAME:}}
portfolio.mail.notification-email=${PORTFOLIO_NOTIFICATION_EMAIL:}
portfolio.contact.rate-limit.maximum=${PORTFOLIO_CONTACT_RATE_LIMIT_MAXIMUM:5}
portfolio.contact.rate-limit.window=${PORTFOLIO_CONTACT_RATE_LIMIT_WINDOW:15m}
