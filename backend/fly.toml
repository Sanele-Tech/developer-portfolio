app = "sanele-portfolio-backend-placeholder"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/home"
    timeout = "5s"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
  size = "shared-cpu-1x"
